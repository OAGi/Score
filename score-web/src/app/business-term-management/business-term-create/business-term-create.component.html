<score-detail-page [title]="title">
  <score-detail-card>
    <mat-form-field>
      <mat-label>Business Term</mat-label>
      <input matInput required [(ngModel)]="businessTerm.businessTerm" maxlength="255"/>
    </mat-form-field>

    <mat-form-field>
      <mat-label>External Reference URI</mat-label>
      <input matInput required [(ngModel)]="businessTerm.externalReferenceUri" maxlength="65535"/>
    </mat-form-field>

    <mat-form-field>
      <mat-label>External Reference ID</mat-label>
      <input matInput [(ngModel)]="businessTerm.externalReferenceId" maxlength="100"/>
    </mat-form-field>

    <mat-form-field>
      <mat-label>Comment</mat-label>
      <textarea rows="6" cols="30" matInput [(ngModel)]="businessTerm.comment"></textarea>
    </mat-form-field>

  </score-detail-card>
  <ng-container ngProjectAs="[detailActions]">
    <button mat-raised-button color="primary" (click)="create()"
            [disabled]="isDisabled(businessTerm)">
      Create
    </button>
  </ng-container>
</score-detail-page>
