<score-list-page title="Business Term">
  <ng-container ngProjectAs="[listActions]">
    <button mat-raised-button class="ms-2" color="primary" routerLink="create">
      New Business Term
    </button>
    <button mat-raised-button class="ms-2" color="primary" (click)="openImportDialog()">
      Upload Business Terms
    </button>
    <button mat-raised-button class="ms-2" color="warn" (click)="discard()"
      [disabled]="selection.selected.length === 0">
      Discard
    </button>
  </ng-container>

  <score-table-view #tableView [table]="columns" [load]="load"
    [selection]="selection" [rowKey]="rowKey" [rowSelectable]="rowSelectable"
    unselectableTooltip="It is currently in use by another component.">

    <ng-container scoreColumnDef="businessTerm">
      <td score-cell *scoreCellDef="let element">
        <div class="businessTerm score-line-clamp-2 score-break-word">
          <a routerLink="{{ element.businessTermId }}">
            <span class="score-line-clamp-2 score-break-word">{{ element.businessTerm }}</span>
          </a>
        </div>
        <div class="description">{{ element.guid }}</div>
      </td>
    </ng-container>

    <ng-container scoreColumnDef="externalReferenceUri">
      <td score-cell *scoreCellDef="let element">
        <a target="_blank" rel="noopener noreferrer"
          href="{{ element.externalReferenceUri }}">
          <span class="score-line-clamp-2 score-break-word">{{ element.externalReferenceUri }}</span>
        </a>
      </td>
    </ng-container>

    <ng-container scoreColumnDef="externalReferenceId">
      <td score-cell *scoreCellDef="let element">
        <span class="score-line-clamp-2 score-break-word">{{ element.externalReferenceId }}</span>
      </td>
    </ng-container>

    <ng-container scoreColumnDef="definition">
      <td score-cell *scoreCellDef="let element">
        <div class="description score-line-clamp-2 score-break-word"
        [innerHTML]="element.definition | highlight : tableView.applied('definition') : ['bg-warning']"></div>
      </td>
    </ng-container>

    <ng-container scoreColumnDef="lastUpdateTimestamp">
      <td score-cell *scoreCellDef="let element">
        <div class="score-line-clamp-2 score-break-word">
          <div>{{ element.lastUpdated.when | date: 'yyyy-MM-dd HH:mm:ss' }}</div>
          <div class="description"><span class="pe-1">by</span><b class="score-break-word">{{ element.lastUpdated.who.loginId }}</b></div>
        </div>
      </td>
    </ng-container>
  </score-table-view>
</score-list-page>
