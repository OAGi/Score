<score-detail-page [title]="title">
  <score-detail-card>
    <mat-form-field>
      <mat-label>Business Term</mat-label>
      <input matInput required placeholder="Business Term" [(ngModel)]="businessTerm.businessTerm" maxlength="255"/>
    </mat-form-field>

    <mat-form-field>
      <mat-label>External Reference URI</mat-label>
      <div class="d-flex align-items-center">
        <input matInput required placeholder="External Reference URI" [(ngModel)]="businessTerm.externalReferenceUri" maxlength="65535"/>
        <button mat-icon-button mat-small-icon-button aria-label="Follow external reference URI"
          matTooltip="Open the external reference URI in a new tab" (click)="followTheExternalUri()">
          <mat-icon>link</mat-icon>
        </button>
      </div>
    </mat-form-field>

    <mat-form-field>
      <mat-label>External Reference ID</mat-label>
      <input matInput [(ngModel)]="businessTerm.externalReferenceId" maxlength="100"/>
    </mat-form-field>

    <mat-form-field>
      <mat-label>Definition</mat-label>
      <textarea rows="6" cols="30" [disabled]="true" matInput
      [(ngModel)]="businessTerm.definition"></textarea>
    </mat-form-field>

    <mat-form-field>
      <mat-label>Comment</mat-label>
      <textarea rows="6" cols="30" matInput [(ngModel)]="businessTerm.comment"></textarea>
    </mat-form-field>
  </score-detail-card>
  <ng-container ngProjectAs="[detailActions]">
    <button mat-raised-button color="primary" (click)="update()"
      [disabled]="!isChanged() || isDisabled(businessTerm)">
      Update
    </button>
    @if (!this.businessTerm.used) {
      <button mat-raised-button color="warn" (click)="discard()"
        >
        Discard
      </button>
    }
  </ng-container>
</score-detail-page>
