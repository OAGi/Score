<score-dialog-page title="{{ actionName }} Agency ID List Value">
  <div class="content dialog-form">
    <mat-card>
      <mat-card-content>
        <mat-form-field>
          <mat-label>Value</mat-label>
          <input matInput required maxlength="255"
            [disabled]="!isEditable || derived || hasRevision"
            [(ngModel)]="agencyIdListValue.value">
        </mat-form-field>

        <mat-form-field>
          <mat-label>Meaning</mat-label>
          <input matInput required maxlength="100"
            [disabled]="!isEditable"
            [(ngModel)]="agencyIdListValue.name">
        </mat-form-field>

        <mat-form-field>
          <mat-label>Definition</mat-label>
          <textarea matInput rows="6" cols="30"
            [disabled]="!isEditable"
          [(ngModel)]="agencyIdListValue.definition.content"></textarea>
        </mat-form-field>

        <mat-form-field>
          <mat-label>Definition Source</mat-label>
          <input matInput maxlength="100"
            [disabled]="!isEditable"
            [(ngModel)]="agencyIdListValue.definition.source">
        </mat-form-field>

        <div class="row">
          <div class="col-4">
            <mat-checkbox color="warn"
              [disabled]="!isEditable || actionName === 'Add' || !isDeprecatedChangeable"
              [(ngModel)]="agencyIdListValue.deprecated">
              <span>Deprecated</span>
            </mat-checkbox>
          </div>
          @if (isDeveloper) {
            <div class="col-4"
              [matTooltip]="'When set, this will be used as the default agency ID list value in Code Lists created by developers.'">
              <mat-checkbox color="warn"
                [disabled]="!isEditable"
                [(ngModel)]="agencyIdListValue.developerDefault">
                <span>Developer Default</span>
              </mat-checkbox>
            </div>
          }
          @if (isDeveloper) {
            <div class="col-4"
              [matTooltip]="'When set, this will be used as the default agency ID list value in Code Lists created by end-users.'">
              <mat-checkbox color="warn"
                [disabled]="!isEditable"
                [(ngModel)]="agencyIdListValue.userDefault">
                <span>User Default</span>
              </mat-checkbox>
            </div>
          }
        </div>
      </mat-card-content>
    </mat-card>
  </div>

  <ng-container ngProjectAs="[dialogActions]">
    @if (isEditable) {
      <button mat-raised-button color="warn" mat-dialog-close>
        <mat-icon>close</mat-icon>
        <span class="ps-2">Cancel</span>
      </button>
      <button mat-raised-button color="primary"
          [disabled]="isDisabled()"
          [mat-dialog-close]="agencyIdListValue">
        <mat-icon>{{ (actionName === 'Add') ? 'add' : 'save' }}</mat-icon>
        <span class="ps-2">{{ (actionName === 'Add') ? 'Add' : 'Save' }}</span>
      </button>
    }
  </ng-container>
</score-dialog-page>
