<score-list-page [title]="title" [subtitle]="subtitle" [loading]="loading" [toolbarClass]="toolbarClass"
  [spacer]="spacer" [showColumns]="showColumns" [tableWrapperClass]="tableWrapperClass">
  <ng-container ngProjectAs="[listTitle]">
    <ng-content select="[wizardTitle]"></ng-content>
  </ng-container>
  <ng-container ngProjectAs="[listFilter]">
    <ng-content select="[listFilter]"></ng-content>
  </ng-container>
  <ng-container ngProjectAs="[listColumns]">
    <ng-content select="[listColumns]"></ng-content>
  </ng-container>
  <ng-container ngProjectAs="[listTable]">
    <ng-content select="[listTable]"></ng-content>
  </ng-container>
  <ng-container ngProjectAs="[listExtra]">
    <ng-content select="[listExtra]"></ng-content>
  </ng-container>
  <ng-container ngProjectAs="[listFooter]">
    <div class="row action-group m-0">
      <div class="col-12 actions-wrap">
        <div class="actions">
          <ng-content select="[wizardActions]"></ng-content>
        </div>
      </div>
    </div>
  </ng-container>
</score-list-page>
