<div class="dialog-header" mat-dialog-title>
  <div class="dialog-title">
    @if (title !== null) {
      <span>{{ title }}</span>
    }
    <ng-content select="[dialogTitle]"></ng-content>
    @if (subtitle) {
      <mat-card-subtitle class="dialog-subtitle">{{ subtitle }}</mat-card-subtitle>
    }
  </div>
  @if (closable) {
    <button mat-icon-button mat-small-icon-button class="dialog-close" aria-label="Close" mat-dialog-close>
      <mat-icon>close</mat-icon>
    </button>
  }
</div>

<div class="dialog-body" mat-dialog-content>
  <ng-content></ng-content>
</div>

<div class="dialog-actions" mat-dialog-actions>
  <ng-content select="[dialogActions]"></ng-content>
</div>
