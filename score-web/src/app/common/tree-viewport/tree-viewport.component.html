<cdk-virtual-scroll-viewport [itemSize]="itemSize" [minBufferPx]="minBufferPx" [maxBufferPx]="maxBufferPx"
                             [style.height.px]="height">
  <div cdkDropList
       [cdkDropListEnterPredicate]="canDrop"
       [cdkDropListData]="dataSource"
       (cdkDropListDropped)="dropped.emit($event)">
    <div *cdkVirtualFor="let node of dataSource" class="example-item"
         (mouseover)="node.showCopyLinkIcon = true" (mouseout)="node.showCopyLinkIcon = false"
         cdkDrag [cdkDragData]="node"
         [cdkDragDisabled]="!isDraggable(node)">
      <div class="dragPlaceholder" *cdkDragPlaceholder></div>
      <div class="mat-tree-node d-flex align-items-center pointer"
           tabIndex="0"
           [attr.data-level]="node.level"
           [attr.data-path]="node.path"
           [attr.data-query-path]="node.queryPath"
           [class.tree-node-selected]="cursorNode === node"
           (click)="onClick(node, $event)"
           (keydown)="onKeydown(node, $event)"
           [matTooltip]="'Circular reference detected.'"
           [matTooltipDisabled]="!node.isCycle"
           [style.padding-left]="node.level * paddingPixel + 'px'">
        @if (dataSource.isExpandable(node)) {
          <button mat-icon-button (click)="toggle(node, $event)">
            <mat-icon class="mat-icon-rtl-mirror">
              {{ dataSource.isExpanded(node) ? 'expand_more' : 'chevron_right' }}
            </mat-icon>
          </button>
        } @else {
          <button mat-icon-button disabled></button>
        }

        <ng-container *ngTemplateOutlet="prefix; context: {$implicit: node}"></ng-container>
        <ng-container *ngTemplateOutlet="content; context: {$implicit: node}"></ng-container>

        @if (!isActionsHidden(node)) {
          <div class="tree-row-actions ms-auto me-2">
            <mat-icon class="copy-link-icon" matTooltip="Copy Link"
                      [style.visibility]="node.showCopyLinkIcon ? '' : 'hidden'"
                      (click)="onCopyLink(node, $event)">link
            </mat-icon>
            @if (showDragHandle(node)) {
              <mat-icon class="dragHandle" cdkDragHandle>drag_handle</mat-icon>
            }
            <mat-icon class="context-menu-icon"
                      [style.visibility]="!node.isCycle ? '' : 'hidden'"
                      [matMenuTriggerFor]="contextMenu"
                      [matMenuTriggerData]="{'menuId': 'contextMenu', 'hashPath': node.hashPath}"
                      (click)="onContextMenuOpen(node, $event)">more_vert
            </mat-icon>
          </div>
        }
      </div>
    </div>
  </div>
</cdk-virtual-scroll-viewport>
