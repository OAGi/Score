<score-base-page [title]="title" [subtitle]="subtitle" [toolbarClass]="toolbarClass" [spacer]="spacer">
  <ng-container ngProjectAs="[baseTitle]">
    <ng-content select="[listTitle]"></ng-content>
  </ng-container>
  <ng-container ngProjectAs="[baseActions]">
    <ng-content select="[listActions]"></ng-content>
  </ng-container>

  <mat-card class="pt-3">
    <ng-content select="[listHeader]"></ng-content>
    <ng-content select="[listFilter]"></ng-content>

    <mat-card-content class="mat-card-container">
      @if (loading) {
        <div class="loading-container">
          <mat-spinner [diameter]="40"></mat-spinner>
        </div>
      }

      <div class="table-container">
        @if (showColumns) {
          <ng-content select="[listToolbar]">
            <div class="score-column-container align-items-center">
              <ng-content select="[listColumns]"></ng-content>
            </div>
          </ng-content>
        }
        <div [class]="tableWrapperClass">
          <ng-content select="[listTable]"></ng-content>
        </div>
      </div>
    </mat-card-content>

    <ng-content select="[listExtra]"></ng-content>
  </mat-card>

  <ng-content select="[listFooter]"></ng-content>
</score-base-page>
