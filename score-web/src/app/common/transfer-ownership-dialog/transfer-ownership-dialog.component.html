<score-dialog-page title="Transfer ownership">
  <score-table-view #tableView [table]="columns" [load]="load" [extraParams]="extraParams"
        [selection]="selection" singleSelect [syncUrl]="false" pageFromResponse>

    <ng-container scoreColumnDef="loginId">
      <td score-cell *scoreCellDef="let element">
        <span class="score-line-clamp-2 score-break-word">{{ element.loginId }}</span>
      </td>
    </ng-container>

    <ng-container scoreColumnDef="role">
      <td score-cell *scoreCellDef="let element">
        @switch (element.developer) {
          @case (true) {
            <span>Developer</span>
          }
          @case (false) {
            <span>End User</span>
          }
        }
      </td>
    </ng-container>

    <ng-container scoreColumnDef="name">
      <td score-cell *scoreCellDef="let element">
        <span class="score-line-clamp-2 score-break-word">{{ element.name }}</span>
      </td>
    </ng-container>

    <ng-container scoreColumnDef="organization">
      <td score-cell *scoreCellDef="let element">
        <span class="score-line-clamp-2 score-break-word">{{ element.organization }}</span>
      </td>
    </ng-container>

    <ng-container scoreColumnDef="status">
      <td score-cell *scoreCellDef="let element">
        {{ (element.enabled) ? 'Enable' : 'Disable' }}
      </td>
    </ng-container>
      </score-table-view>

  <ng-container ngProjectAs="[dialogActions]">
    <button mat-raised-button color="warn" (click)="onNoClick()">
      <mat-icon>close</mat-icon>
      Cancel
    </button>
    <button mat-raised-button color="primary"
      [disabled]="selection.selected.length === 0"
      [mat-dialog-close]="selection.selected[0]">
      <mat-icon>send</mat-icon>
      Transfer
    </button>
  </ng-container>
</score-dialog-page>
