<div class="row m-0">
  <div class="col-12 p-0">
    <mat-card #header class="search-box-container mb-1">
      <mat-card-content>
        @if (ready && searcher) {
          <div class="tree-detail-header-row">
            <score-tree-search-bar class="tree-detail-search" [searcher]="searcher" [tree]="tree" [selectedNode]="selectedNode"
                                   (nodeSelect)="nodeSelect.emit($event)"></score-tree-search-bar>
            <div class="actions-wrap tree-detail-actions">
              <ng-content select="[treeDetailActions]"></ng-content>
            </div>
          </div>
        }
      </mat-card-content>
      @if (ready && searcher) {
        <score-tree-breadcrumbs [nodes]="selectedNode?.parents"
                                (nodeClick)="onBreadcrumbClick($event)"></score-tree-breadcrumbs>
      }
    </mat-card>
  </div>
</div>
<div class="row m-0">
  <div class="col-12 p-0">
    <as-split unit="percent" [direction]="'horizontal'" [disabled]="narrow" [class.tree-detail-stacked]="narrow" [style.overflow-y]="splitScroll ? 'scroll' : null">
      <as-split-area class="left-panel" size="30" [minSize]="15">
        <mat-card class="tree-panel">
          <mat-card-content class="mat-card-container">
            <ng-content select="[treeDetailTree]"></ng-content>
          </mat-card-content>
        </mat-card>
      </as-split-area>
      <as-split-area class="right-panel" size="70" [minSize]="30" [style.height.px]="narrow ? null : treeHeight + 17">
        <ng-content select="[treeDetailPane]"></ng-content>
      </as-split-area>
    </as-split>
  </div>
</div>
