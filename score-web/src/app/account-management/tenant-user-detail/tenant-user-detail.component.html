<score-list-page [title]="((!!tenantInfo) ? (tenantInfo.name + ' - ') : '') + title">
  <ng-container ngProjectAs="[listActions]">
    @if (!addUserToTenant) {
      <button mat-raised-button class="ms-2" color="primary"
        (click)="setAddUserView()">
        Add User
      </button>
    } @else {
      <button mat-raised-button class="ms-2" color="primary" (click)="setListView()">
        Done
      </button>
    }
  </ng-container>

  <score-table-view [table]="columns" [load]="load" [ready]="ready()" [busy]="busy()" [extraParams]="extraParams()"
    pageFromResponse>

    <ng-container scoreColumnDef="loginId">
      <td score-cell *scoreCellDef="let element">
        <span class="score-line-clamp-2 score-break-word">{{ element.loginId }}</span>
      </td>
    </ng-container>

    <ng-container scoreColumnDef="role">
      <td score-cell *scoreCellDef="let element">
        @switch (element.developer) {
          @case (true) {
            <span>Developer</span>
          }
          @case (false) {
            <span>End User</span>
          }
        }
      </td>
    </ng-container>

    <ng-container scoreColumnDef="name">
      <td score-cell *scoreCellDef="let element">
        <span class="score-line-clamp-2 score-break-word">{{ element.name }}</span>
      </td>
    </ng-container>

    <ng-container scoreColumnDef="organization">
      <td score-cell *scoreCellDef="let element">
        <span class="score-line-clamp-2 score-break-word">{{ element.organization }}</span>
      </td>
    </ng-container>

    <ng-container scoreColumnDef="status">
      <td score-cell *scoreCellDef="let element">
        {{ (element.enabled) ? 'Enable' : 'Disable' }}
      </td>
    </ng-container>

    <ng-container scoreColumnDef="manage">
      <td score-cell *scoreCellDef="let element">
        @if (!addUserToTenant) {
          <button mat-raised-button color="warn" (click)="removeUser(element.userId)"
            style="margin-right: 10px;">
            Remove
          </button>
        } @else {
          <button mat-raised-button color="accent" (click)="addUser(element.userId)"
            style="margin-right: 10px;">
            Add
          </button>
        }
      </td>
    </ng-container>
  </score-table-view>
</score-list-page>
