<score-list-page [title]="((!!tenantInfo) ? (tenantInfo.name + ' - ') : '') + title">
  <ng-container ngProjectAs="[listActions]">
    @if (!addBusinessCtxToTenant) {
      <button mat-raised-button class="ms-2" color="primary"
        (click)="setAddBusinessCtxView()">
        Add Business Context
      </button>
    } @else {
      <button mat-raised-button class="ms-2" color="primary" (click)="setListView()">
        Done
      </button>
    }
  </ng-container>

  <score-table-view emptyMessage="No Business Context" [table]="columns" [load]="load" [ready]="ready()" [busy]="busy()" [extraParams]="extraParams()">

    <ng-container scoreColumnDef="name">
      <td score-cell *scoreCellDef="let element">
        <span class="score-line-clamp-2 score-break-word">{{ element.name }}</span>
        <div class="description">{{ element.guid }}</div>
      </td>
    </ng-container>

    <ng-container scoreColumnDef="lastUpdateTimestamp">
      <td score-cell *scoreCellDef="let element">
        <div class="score-line-clamp-2 score-break-word">
          <div>{{ element.lastUpdated.when | date: 'yyyy-MM-dd HH:mm:ss' }}</div>
          <div class="description"><span class="pe-1">by</span><b class="score-break-word">{{ element.lastUpdated.who.loginId }}</b></div>
        </div>
      </td>
    </ng-container>

    <ng-container scoreColumnDef="manage">
      <td score-cell *scoreCellDef="let element">
        @if (!addBusinessCtxToTenant) {
          <button mat-raised-button color="warn" style="margin-right: 10px;"
            (click)="removeTenantBusinessCtx(element.businessContextId)">
            Remove
          </button>
        } @else {
          <button mat-raised-button color="accent" style="margin-right: 10px;"
            (click)="addTenantBusinessCtx(element.businessContextId)">
            Add
          </button>
        }
      </td>
    </ng-container>
    <!-- A narrow screen: the record as one block, not the columns squeezed. -->
    <ng-container *scoreCompactDef="let element">
      <score-record-compact-row [record]="compactRecord(element)">
        @if (!addBusinessCtxToTenant) {
          <button actions mat-raised-button color="warn" (click)="removeTenantBusinessCtx(element.businessContextId)">Remove</button>
        } @else {
          <button actions mat-raised-button color="accent" (click)="addTenantBusinessCtx(element.businessContextId)">Add</button>
        }
      </score-record-compact-row>
    </ng-container>
  </score-table-view>
</score-list-page>
