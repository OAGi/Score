<score-list-page title="Account">
  <ng-container ngProjectAs="[listActions]">
    <score-responsive-button label="New Account" link="create"/>
  </ng-container>

  <score-table-view emptyMessage="No Account" [table]="columns" [load]="load" pageFromResponse>

    <ng-container scoreColumnDef="loginId">
      <td score-cell *scoreCellDef="let element">
        <a routerLink="{{ element.userId }}">
          <span class="score-line-clamp-2 score-break-word">{{ element.loginId }}</span>
        </a>
      </td>
    </ng-container>

    <ng-container scoreColumnDef="role">
      <td score-cell *scoreCellDef="let element">
        @switch (element.developer) {
          @case (true) {
            <span>Developer</span>
          }
          @case (false) {
            <span>End User</span>
          }
        }
      </td>
    </ng-container>

    <ng-container scoreColumnDef="name">
      <td score-cell *scoreCellDef="let element">
        <span class="score-line-clamp-2 score-break-word">{{ element.username }}</span>
      </td>
    </ng-container>

    <ng-container scoreColumnDef="organization">
      <td score-cell *scoreCellDef="let element">
        <span class="score-line-clamp-2 score-break-word">{{ element.organization }}</span>
      </td>
    </ng-container>

    <ng-container scoreColumnDef="status">
      <td score-cell *scoreCellDef="let element">
        {{ (element.enabled) ? 'Enable' : 'Disable' }}
      </td>
    </ng-container>
    <!-- A narrow screen: the record as one block, not the columns squeezed. -->
    <ng-container *scoreCompactDef="let element">
      <score-record-compact-row [record]="compactRecord(element)"/>
    </ng-container>
  </score-table-view>
</score-list-page>
