<score-list-page title="Pending Account">
  <score-table-view [table]="columns" [load]="load">

    <ng-container scoreColumnDef="preferredUsername">
      <td score-cell *scoreCellDef="let element">
        <a routerLink="/account/pending/{{ element.appOauth2UserId }}">
          <span class="score-line-clamp-2 score-break-word">{{ element.preferredUsername }}</span>
        </a>
      </td>
    </ng-container>

    <ng-container scoreColumnDef="email">
      <td score-cell *scoreCellDef="let element">
        <a routerLink="/account/pending/{{ element.appOauth2UserId }}">
          <span class="score-line-clamp-2 score-break-word">{{ element.email }}</span>
        </a>
      </td>
    </ng-container>

    <ng-container scoreColumnDef="providerName">
      <td score-cell *scoreCellDef="let element">
        <span class="score-line-clamp-2 score-break-word">{{ element.providerName }}</span>
      </td>
    </ng-container>

    <ng-container scoreColumnDef="creationTimestamp">
      <td score-cell *scoreCellDef="let element">
        <span class="score-line-clamp-2 score-break-word">{{ element.creationTimestamp | date: 'yyyy-MM-dd HH:mm:ss' }}</span>
      </td>
    </ng-container>
  </score-table-view>
</score-list-page>
