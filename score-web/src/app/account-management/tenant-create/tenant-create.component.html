<score-detail-page [title]="title">
  <score-detail-card cardClass="mb-2">
    <mat-form-field>
      <mat-label>Name</mat-label>
      <input matInput required [(ngModel)]="name" maxlength="50"/>
    </mat-form-field>
  </score-detail-card>
  <ng-container ngProjectAs="[detailActions]">
    <button mat-raised-button color="primary" (click)="create()"
            [disabled]="isDisabled(name)">
      Create
    </button>
  </ng-container>
</score-detail-page>
