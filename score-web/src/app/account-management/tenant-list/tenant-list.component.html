<score-list-page title="Tenant Roles">
  <ng-container ngProjectAs="[listActions]">
    <score-responsive-button label="New Tenant" link="create"/>
  </ng-container>

  <score-table-view emptyMessage="No Tenant" [table]="columns" [load]="load">

    <ng-container scoreColumnDef="name">
      <td score-cell *scoreCellDef="let element">
        <a routerLink="{{ element.tenantId }}">
          <span class="score-line-clamp-2 score-break-word">{{ element.name }}</span>
        </a>
      </td>
    </ng-container>

    <ng-container scoreColumnDef="users">
      <td score-cell *scoreCellDef="let element">
        <button mat-raised-button color="primary" routerLink="users/{{ element.tenantId }}"
          style="margin-right: 10px;">
          Manage Users
        </button>
      </td>
    </ng-container>

    <ng-container scoreColumnDef="businessContexts">
      <td score-cell *scoreCellDef="let element">
        <button mat-raised-button color="primary" routerLink="bis-ctx/{{ element.tenantId }}"
          style="margin-right: 10px;">
          Manage Business Context
        </button>
      </td>
    </ng-container>
    <!-- A narrow screen: the record as one block, not the columns squeezed. -->
    <ng-container *scoreCompactDef="let element">
      <score-record-compact-row [record]="compactRecord(element)">
          <button actions mat-raised-button color="primary" routerLink="/tenant/users/{{ element.tenantId }}">Manage Users</button>
          <button actions mat-raised-button color="primary" routerLink="/tenant/bis-ctx/{{ element.tenantId }}">Manage Business Context</button>
      </score-record-compact-row>
    </ng-container>
  </score-table-view>
</score-list-page>
