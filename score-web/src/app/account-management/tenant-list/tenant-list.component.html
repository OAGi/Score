<score-list-page title="Tenant Roles">
  <ng-container ngProjectAs="[listActions]">
    <button mat-raised-button class="ms-2" color="primary" routerLink="create">
      New Tenant
    </button>
  </ng-container>

  <score-table-view [table]="columns" [load]="load">

    <ng-container scoreColumnDef="name">
      <td score-cell *scoreCellDef="let element">
        <a routerLink="{{ element.tenantId }}">
          <span class="score-line-clamp-2 score-break-word">{{ element.name }}</span>
        </a>
      </td>
    </ng-container>

    <ng-container scoreColumnDef="users">
      <td score-cell *scoreCellDef="let element">
        <button mat-raised-button color="primary" routerLink="users/{{ element.tenantId }}"
          style="margin-right: 10px;">
          Manage Users
        </button>
      </td>
    </ng-container>

    <ng-container scoreColumnDef="businessContexts">
      <td score-cell *scoreCellDef="let element">
        <button mat-raised-button color="primary" routerLink="bis-ctx/{{ element.tenantId }}"
          style="margin-right: 10px;">
          Manage Business Context
        </button>
      </td>
    </ng-container>
  </score-table-view>
</score-list-page>
