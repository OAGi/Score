<score-dialog-page title="{{ title }}">
  <score-table-view #tableView [table]="columns" [load]="load" [extraParams]="extraParams" [ready]="ready()"
        [selection]="selection" singleSelect [selectOnRowClick]="false" [syncUrl]="false" [columnSelector]="false" pageFromResponse>

    <ng-container scoreColumnDef="loginId">
      <td score-cell *scoreCellDef="let element">
        <span class="score-line-clamp-2 score-break-word">{{ element.loginId }}</span>
      </td>
    </ng-container>

    <ng-container scoreColumnDef="role">
      <td score-cell *scoreCellDef="let element">
        @switch (element.developer) {
          @case (true) {
            <span>Developer</span>
          }
          @case (false) {
            <span>End User</span>
          }
        }
      </td>
    </ng-container>

    <ng-container scoreColumnDef="name">
      <td score-cell *scoreCellDef="let element">
        <span class="score-line-clamp-2 score-break-word">{{ element.name }}</span>
      </td>
    </ng-container>

    <ng-container scoreColumnDef="organization">
      <td score-cell *scoreCellDef="let element">
        <span class="score-line-clamp-2 score-break-word">{{ element.organization }}</span>
      </td>
    </ng-container>

    <ng-container scoreColumnDef="appOauth2UserId">
      <td score-cell *scoreCellDef="let element">
        @if (element.appOauth2UserId) {
          <span>Yes</span>
        }
      </td>
    </ng-container>
  </score-table-view>

  <ng-container ngProjectAs="[dialogActions]">
    <button mat-raised-button color="warn" (click)="close()">
      <mat-icon>close</mat-icon>
      <span class="ps-2">Cancel</span>
    </button>
    <button mat-raised-button color="primary"
      [disabled]="selection.selected.length === 0"
      (click)="link()">
      <mat-icon>link</mat-icon>
      <span class="ps-2">Link</span>
    </button>
  </ng-container>
</score-dialog-page>
