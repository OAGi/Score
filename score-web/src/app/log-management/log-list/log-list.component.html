<score-list-page title="History">
  <ng-container ngProjectAs="[listActions]">
    <button mat-raised-button class="ms-2" color="primary"
      [disabled]="selection.selected.length != 2"
      (click)="openCompareDialog()">
      <mat-icon matTooltip="Compare">compare</mat-icon> Compare
    </button>
  </ng-container>

  <score-table-view [table]="columns" [load]="load" pageFromResponse>

    <ng-container [scoreColumnDef]="columns.column('check')">
      <td score-cell *scoreCellDef="let element">
        <mat-checkbox (click)="$event.stopPropagation()"
          (change)="$event ? toggle(element) : null"
        [checked]="isSelected(element)"></mat-checkbox>
      </td>
    </ng-container>

    <ng-container scoreColumnDef="commit">
      <td score-cell *scoreCellDef="let element" [matTooltip]="element.hash">
        {{ element.hash.substring(0, 8) }}
      </td>
    </ng-container>

    <ng-container scoreColumnDef="revisionNum">
      <td score-cell *scoreCellDef="let element">
        {{ element.revisionNum }}
      </td>
    </ng-container>

    <ng-container scoreColumnDef="revisionAction">
      <td score-cell *scoreCellDef="let element">
        <span [class]="element.logAction">{{ logAction(element) }}</span>
      </td>
    </ng-container>

    <ng-container scoreColumnDef="loginId">
      <td score-cell *scoreCellDef="let element">
        <span class="score-line-clamp-2 score-break-word">{{ element.loginId }}</span>
      </td>
    </ng-container>

    <ng-container scoreColumnDef="timestamp">
      <td score-cell *scoreCellDef="let element">
        {{ element.timestamp | dateAgo }}
      </td>
    </ng-container>
  </score-table-view>
</score-list-page>
