<score-list-page title="Message">
  <ng-container ngProjectAs="[listActions]">
    <score-responsive-button label="Discard" icon="delete" color="warn" [hidden]="selection.selected.length === 0" (pressed)="discard()"/>
  </ng-container>

  <score-table-view emptyMessage="No Message" [table]="columns" [load]="load" [selection]="selection" [rowKey]="rowKey">

    <ng-container scoreColumnDef="subject">
      <td score-cell *scoreCellDef="let element">
        <a routerLink="{{ element.messageId }}">
          <span [className]="element.read ? 'read' : 'unread'">{{ element.subject }}</span>
        </a>
      </td>
    </ng-container>

    <ng-container scoreColumnDef="timestamp">
      <td score-cell *scoreCellDef="let element">
        <div class="ellipsis">{{ element.created.when | date: 'yyyy-MM-dd HH:mm:ss' }}</div>
        <div class="description"><span class="pe-1">by</span><b class="score-break-word">{{ element.created.who.loginId }}</b></div>
      </td>
    </ng-container>
    <!-- A narrow screen: the record as one block, not the columns squeezed. -->
    <ng-container *scoreCompactDef="let element">
      <score-record-compact-row [record]="compactRecord(element)"/>
    </ng-container>
  </score-table-view>
</score-list-page>
