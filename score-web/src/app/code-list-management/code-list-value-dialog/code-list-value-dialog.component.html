<score-dialog-page title="{{ actionName }} Code List Value">
  <div class="content dialog-form">
    <mat-card>
      <mat-card-content>
        <mat-form-field>
          <mat-label>Code</mat-label>
          <input matInput required maxlength="255"
            [disabled]="!isEditable || codeListValue.derived || hasRevision"
            [(ngModel)]="codeListValue.value">
        </mat-form-field>

        <mat-form-field>
          <mat-label>Meaning</mat-label>
          <input matInput required maxlength="100"
            [disabled]="!isEditable"
            [(ngModel)]="codeListValue.meaning">
        </mat-form-field>

        <mat-form-field>
          <mat-label>Definition</mat-label>
          <textarea matInput rows="6" cols="30"
            [disabled]="!isEditable"
          [(ngModel)]="codeListValue.definition.content"></textarea>
        </mat-form-field>

        <mat-form-field>
          <mat-label>Definition Source</mat-label>
          <input matInput maxlength="100"
            [disabled]="!isEditable"
            [(ngModel)]="codeListValue.definition.source">
        </mat-form-field>

        <div class="row">
          <div class="col-12">
            <mat-checkbox color="warn"
              [disabled]="!isEditable || actionName === 'Add' || !isDeprecatedChangeable"
              [(ngModel)]="codeListValue.deprecated">
              <span>Deprecated</span>
            </mat-checkbox>
          </div>
        </div>
      </mat-card-content>
    </mat-card>
  </div>

  <ng-container ngProjectAs="[dialogActions]">
    @if (isEditable) {
      <button mat-raised-button color="warn" mat-dialog-close>
        <mat-icon>close</mat-icon>
        <span class="ps-2">Cancel</span>
      </button>
      <button mat-raised-button color="primary"
          [disabled]="isDisabled()"
          [mat-dialog-close]="codeListValue">
        <mat-icon>{{ (actionName === 'Add') ? 'add' : 'save' }}</mat-icon>
        <span class="ps-2">{{ (actionName === 'Add') ? 'Add' : 'Save' }}</span>
      </button>
    }
  </ng-container>
</score-dialog-page>
