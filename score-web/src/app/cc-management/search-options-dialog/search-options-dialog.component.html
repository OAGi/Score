<score-dialog-page title="Search Options">
  <div class="dialog-form">
    <mat-checkbox [(ngModel)]="options.excludeDataTypeSupplementaryComponents">
      Exclude Data Type Supplementary Components
    </mat-checkbox>
  </div>

  <ng-container ngProjectAs="[dialogActions]">
    <button mat-raised-button color="warn" (click)="onNoClick()">
      <mat-icon>close</mat-icon>
      <span class="ps-2">Cancel</span>
    </button>
    <button mat-raised-button color="primary"
            (click)="onClick()"
            [mat-dialog-close]="true">
      <mat-icon>check</mat-icon>
      <span class="ps-2">Apply</span>
    </button>
  </ng-container>
</score-dialog-page>
