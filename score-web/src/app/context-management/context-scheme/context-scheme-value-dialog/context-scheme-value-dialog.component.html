<score-dialog-page [title]="actionName + ' Context Scheme Value'">
  <div class="dialog-form">
    <mat-card>
      <mat-card-content>
        <mat-form-field>
          <mat-label>Value</mat-label>
          <input matInput required [(ngModel)]="contextSchemeValue.value" maxlength="45">
        </mat-form-field>

        <mat-form-field>
          <mat-label>Meaning</mat-label>
          <textarea rows="6" cols="30" matInput [(ngModel)]="contextSchemeValue.meaning"></textarea>
        </mat-form-field>
      </mat-card-content>
    </mat-card>
  </div>

  <ng-container ngProjectAs="[dialogActions]">
    <button mat-raised-button color="warn" mat-dialog-close>
      <mat-icon>close</mat-icon>
      <span class="ps-2">Cancel</span>
    </button>
    <button mat-raised-button color="primary"
            [disabled]="isDisabled()"
            [mat-dialog-close]="contextSchemeValue">
      <mat-icon>{{ (actionName === 'Add') ? 'add' : 'save' }}</mat-icon>
      <span class="ps-2">{{ (actionName === 'Add') ? 'Add' : 'Save' }}</span>
    </button>
  </ng-container>
</score-dialog-page>
