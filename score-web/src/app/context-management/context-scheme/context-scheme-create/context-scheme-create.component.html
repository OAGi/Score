<score-detail-page [title]="title">
  <score-detail-card>
    <mat-form-field>
      <mat-label>Context Category</mat-label>
      <mat-select placeholder="Context Category" required [(ngModel)]="contextSchemeCreateRequest.contextCategoryId">
        <mat-option>
          <ngx-mat-select-search [formControl]="ctxCategoriesFilterCtrl"
            [placeholderLabel]="'Search...'"
          [noEntriesFoundLabel]="'No matching context category found.'"></ngx-mat-select-search>
        </mat-option>
        @for (contextCategory of filteredCtxCategories | async; track contextCategory) {
          <mat-option [value]="contextCategory.contextCategoryId">
            {{contextCategory.name}}
          </mat-option>
        }
      </mat-select>
    </mat-form-field>

    <mat-form-field>
      <mat-label>Name</mat-label>
      <input matInput required [(ngModel)]="contextSchemeCreateRequest.schemeName" maxlength="255"/>
    </mat-form-field>

    <div class="row" style="padding: 0 0 8px 12px; margin-bottom: 8px;">
      <button class="load-code-list-button" mat-raised-button (click)="openCodeListDialog()" color="primary">
        Load from Code List
      </button>
    </div>

    <mat-form-field>
      <mat-label>Scheme ID</mat-label>
      <input matInput required [(ngModel)]="contextSchemeCreateRequest.schemeId" maxlength="45"/>
    </mat-form-field>

    <mat-form-field>
      <mat-label>Agency ID</mat-label>
      <input matInput required [(ngModel)]="contextSchemeCreateRequest.schemeAgencyId" maxlength="45"/>
    </mat-form-field>

    <mat-form-field>
      <mat-label>Version</mat-label>
      <input matInput required [(ngModel)]="contextSchemeCreateRequest.schemeVersionId" maxlength="45"/>
    </mat-form-field>

    <mat-form-field>
      <mat-label>Description</mat-label>
      <textarea rows="6" cols="30" matInput [(ngModel)]="contextSchemeCreateRequest.description"></textarea>
    </mat-form-field>
  </score-detail-card>

  <score-detail-card heading="Context Scheme Values">
    <score-table-view #tableView [table]="columns" [load]="load" [selection]="selection" [rowKey]="rowKey" [allRows]="allRows"
      [syncUrl]="false" [selectOnRowClick]="false" rowHover pageFromResponse (rowClick)="openDialog($event)">

      <ng-container scoreColumnDef="value">
        <td score-cell *scoreCellDef="let element"> {{ element.value }}</td>
      </ng-container>

      <ng-container scoreColumnDef="meaning">
        <td score-cell *scoreCellDef="let element"> {{ element.meaning }}</td>
      </ng-container>
    </score-table-view>
    <ng-container ngProjectAs="[cardActions]">
      <mat-card-actions style="padding: 16px 0 0 0;">
        <button mat-raised-button (click)="openDialog()" color="primary">
          <mat-icon>add</mat-icon>
          Add
        </button>
        <button mat-raised-button (click)="removeSchemeValues()" class="ms-2"
          [hidden]="values.length === 0"
          [disabled]="this.selection.selected.length === 0"
          color="warn">
          <mat-icon>delete</mat-icon>
          Remove
        </button>
      </mat-card-actions>
    </ng-container>
  </score-detail-card>
  <ng-container ngProjectAs="[detailActions]">
    <button mat-raised-button color="primary" (click)="create()"
      [disabled]="isDisabled()">
      Create
    </button>
  </ng-container>
</score-detail-page>
