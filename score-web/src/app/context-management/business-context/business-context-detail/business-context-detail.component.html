<score-detail-page [title]="title">
  <score-detail-card>
    <mat-form-field>
      <mat-label>Name</mat-label>
      <input matInput required [(ngModel)]="businessContext.name" maxlength="100"/>
    </mat-form-field>
  </score-detail-card>

  <score-detail-card heading="Business Context Values">
    <score-table-view [table]="columns" [load]="load" [selection]="selection" [rowKey]="rowKey" [allRows]="allRows"
      [syncUrl]="false" [selectOnRowClick]="false" rowHover pageFromResponse (rowClick)="openDialog($event)">

      <ng-container scoreColumnDef="contextCategoryName">
        <td score-cell *scoreCellDef="let element">
          <span class="score-line-clamp-2 score-break-word">{{ element.contextCategoryName }}</span>
        </td>
      </ng-container>

      <ng-container scoreColumnDef="contextSchemeName">
        <td score-cell *scoreCellDef="let element">
          <span class="score-line-clamp-2 score-break-word">{{ element.contextSchemeName }}</span>
        </td>
      </ng-container>

      <ng-container scoreColumnDef="contextSchemeValue">
        <td score-cell *scoreCellDef="let element">
          <span>{{ element.contextSchemeValue }}</span>
          <div class="description score-line-clamp-2 score-break-word">
            {{ element.contextSchemeValueMeaning }}
          </div>
        </td>
      </ng-container>
    </score-table-view>
    <ng-container ngProjectAs="[cardActions]">
      <mat-card-actions style="padding: 16px 0 0 0;">
        <button mat-raised-button (click)="openDialog();" color="primary">
          <mat-icon>add</mat-icon>
          Add
        </button>
        <button mat-raised-button (click)="removeBizCtxValues()" class="ms-2"
          [hidden]="values.length == 0"
          [disabled]="this.selection.selected.length == 0"
          color="warn">
          <mat-icon>delete</mat-icon>
          Remove
        </button>
      </mat-card-actions>
    </ng-container>
  </score-detail-card>
  <ng-container ngProjectAs="[detailActions]">
    <button mat-raised-button color="primary" (click)="update()"
      [disabled]="updateDisabled">
      Update
    </button>
    @if (!businessContext.used) {
      <button mat-raised-button color="warn" (click)="discard()"
        >
        Discard
      </button>
    }
  </ng-container>
</score-detail-page>
