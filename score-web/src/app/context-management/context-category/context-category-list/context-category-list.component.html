<score-list-page title="Context Category">
  <ng-container ngProjectAs="[listActions]">
    <button mat-raised-button class="ms-2" color="primary" routerLink="create">
      New Context Category
    </button>
    <button mat-raised-button class="ms-2" color="warn" (click)="discard()"
      [disabled]="selection.selected.length === 0">
      Discard
    </button>
  </ng-container>

  <score-table-view #tableView [table]="columns" [load]="load"
    [selection]="selection" [rowKey]="rowKey" [rowSelectable]="rowSelectable"
    unselectableTooltip="It is currently in use by another component.">

    <ng-container scoreColumnDef="name">
      <td score-cell *scoreCellDef="let element">
        <div class="name score-line-clamp-2 score-break-word">
          <a routerLink="{{ element.contextCategoryId }}">
            <span>{{ element.name }}</span>
          </a>
        </div>
        <div class="description">{{ element.guid }}</div>
      </td>
    </ng-container>

    <ng-container scoreColumnDef="description">
      <td score-cell *scoreCellDef="let element">
        <div class="description score-line-clamp-2 score-break-word"
          [innerHTML]="element.description | highlight : tableView.applied('description') : ['bg-warning']"></div>
      </td>
    </ng-container>

    <ng-container scoreColumnDef="lastUpdateTimestamp">
      <td score-cell *scoreCellDef="let element">
        <div class="score-line-clamp-2 score-break-word">
          <div>{{ element.lastUpdated.when | date: 'yyyy-MM-dd HH:mm:ss' }}</div>
          <div class="description"><span class="pe-1">by</span><b class="score-break-word">{{ element.lastUpdated.who.loginId }}</b></div>
        </div>
      </td>
    </ng-container>
  </score-table-view>
</score-list-page>
