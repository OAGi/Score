<score-detail-page [title]="title">
  <score-detail-card>
    <mat-form-field>
      <mat-label>Name</mat-label>
      <input matInput required [(ngModel)]="contextCategory.name" maxlength="45"/>
    </mat-form-field>

    <mat-form-field>
      <mat-label>Description</mat-label>
      <textarea rows="6" cols="30" matInput [(ngModel)]="contextCategory.description"></textarea>
    </mat-form-field>
  </score-detail-card>
  <ng-container ngProjectAs="[detailActions]">
    <button mat-raised-button color="primary" (click)="update()"
            [disabled]="updateDisabled">
      Update
    </button>
    <button mat-raised-button color="warn" (click)="discard()">
      Discard
    </button>
  </ng-container>
</score-detail-page>
