<score-detail-page [title]="title">
  <score-detail-card>
    <mat-form-field>
      <mat-label>URI</mat-label>
      <input matInput required
        [formControl]="uriForm"
        [value]="uriForm.value">
      @if (uriForm.hasError('pattern')) {
        <mat-error>
          '{{ uriForm.value }}' is not allow for URI format
        </mat-error>
      }
    </mat-form-field>

    <mat-form-field>
      <mat-label>Prefix</mat-label>
      <input matInput [(ngModel)]="namespace.prefix" maxlength="45"
        [disabled]="!namespace.canEdit"/>
    </mat-form-field>

    <mat-form-field>
      <mat-label>Description</mat-label>
      <textarea rows="6" cols="30" matInput [(ngModel)]="namespace.description"
      [disabled]="!namespace.canEdit"></textarea>
    </mat-form-field>

    <mat-checkbox [checked]="namespace.standard" [disabled]="true">Standard</mat-checkbox>

  </score-detail-card>
  <ng-container ngProjectAs="[detailActions]">
    <button mat-raised-button (click)="back()">Back</button>
    @if (namespace.canEdit) {
      <button mat-raised-button color="primary"
        [disabled]="updateDisabled"
        (click)="update()">
        Update
      </button>
    }
    @if (namespace.canEdit) {
      <button mat-raised-button color="warn"
        [disabled]="!namespace.canEdit"
        (click)="discard()">
        Discard
      </button>
    }
  </ng-container>
</score-detail-page>
