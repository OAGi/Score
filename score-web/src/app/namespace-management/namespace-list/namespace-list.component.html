<score-list-page>
  <ng-container ngProjectAs="[listTitle]">
    <score-title-with-library-selector [title]="title"
      [libraries]="libraryChoice.mappedLibraries"
      (libraryChange)="onLibraryChange($event)"/>
  </ng-container>
  <ng-container ngProjectAs="[listActions]">
    @if (libraryChoice.library?.libraryId) {
      <button mat-raised-button class="ms-2" color="primary" (click)="create()">
        New Namespace
      </button>
    }
  </ng-container>

  <score-table-view #tableView [table]="columns" [load]="load" [extraParams]="extraParams()" [ready]="ready()" [busy]="busy()">

    <ng-container scoreColumnDef="uri">
      <td score-cell *scoreCellDef="let element">
        <a routerLink="{{ element.namespaceId }}">
          <div class="score-line-clamp-2 score-break-word">{{ element.uri }}</div>
        </a>
      </td>
    </ng-container>

    <ng-container scoreColumnDef="prefix">
      <td score-cell *scoreCellDef="let element">{{ element.prefix }}</td>
    </ng-container>

    <ng-container scoreColumnDef="owner">
      <td score-cell *scoreCellDef="let element">
        <div class="d-flex align-items-center align-content-center justify-content-between">
          <span class="score-line-clamp-2 score-break-word" [matTooltip]="element.owner.loginId" [innerHTML]="element.owner.loginId"></span>
          @if (isEditable(element)) {
            <mat-icon class="pointer align-self-center" style="padding-right: 24px;"
            (click)="openTransferDialog(element, $event)">swap_horiz</mat-icon>
          }
        </div>
      </td>
    </ng-container>

    <ng-container scoreColumnDef="std">
      <td score-cell *scoreCellDef="let element">
        @if (element.standard) {
          <span>Yes</span>
        }
        @if (!element.standard) {
          <span>No</span>
        }
      </td>
    </ng-container>

    <ng-container scoreColumnDef="description">
      <td score-cell *scoreCellDef="let element">
        <div class="description score-line-clamp-2 score-break-word"
        [innerHTML]="element.description | highlight : tableView.applied('description') : ['bg-warning']"></div>
      </td>
    </ng-container>

    <ng-container scoreColumnDef="lastUpdateTimestamp">
      <td score-cell *scoreCellDef="let element">
        <div class="score-line-clamp-2 score-break-word">
          <div>{{ element.lastUpdated.when | date: 'yyyy-MM-dd HH:mm:ss' }}</div>
          <div class="description"><span class="pe-1">by</span><b class="score-break-word">{{ element.lastUpdated.who.loginId }}</b></div>
        </div>
      </td>
    </ng-container>

    <ng-container [scoreColumnDef]="columns.column('more')">
      <td *scoreCellDef="let element" score-cell>
        <button mat-icon-button
          [matMenuTriggerFor]="contextMenu"
          (click)="contextMenuItem = element; $event.stopPropagation();">
          <mat-icon>more_vert</mat-icon>
        </button>
      </td>
    </ng-container>
  </score-table-view>

  <ng-container ngProjectAs="[listExtra]">
    <mat-menu class="context-menu" #contextMenu="matMenu">
      <button mat-menu-item (click)="openTransferDialog(contextMenuItem)"
        [disabled]="!isEditable(contextMenuItem)">
        <span class="context-menu-item">Transfer Ownership</span>
      </button>
      <button mat-menu-item (click)="discard(contextMenuItem)"
        [disabled]="!isEditable(contextMenuItem)">
        <span class="context-menu-item">Discard</span>
      </button>
    </mat-menu>
  </ng-container>
</score-list-page>
