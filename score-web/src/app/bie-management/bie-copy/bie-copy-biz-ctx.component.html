<score-list-page [title]="'BIE_COPY.TITLE' | translate" [subtitle]="subtitle">
  <score-table-view #tableView [table]="columns" [load]="load" [extraParams]="extraParams"
    [selection]="selection" [rowKey]="rowKey" searchClearsSort rowHover>

    <ng-container scoreColumnDef="name">
      <td score-cell *scoreCellDef="let element">
        <div class="name score-line-clamp-2 score-break-word">
          <a target="_blank" rel="noopener noreferrer"
            href="/context_management/business_context/{{ element.businessContextId }}">
            <span>{{ element.name }}</span>
          </a>
        </div>
        <div class="description">{{ element.guid }}</div>
      </td>
    </ng-container>

    @if (isTenantEnabled) {
      <ng-container scoreColumnDef="tenant">
        <td score-cell *scoreCellDef="let element" >
          {{ element.connectedTenantNames }}
        </td>
      </ng-container>
    }

    <ng-container scoreColumnDef="lastUpdateTimestamp">
      <td score-cell *scoreCellDef="let element">
        <div class="score-line-clamp-2 score-break-word">
          <div>{{ element.lastUpdated.when | date: 'yyyy-MM-dd HH:mm:ss' }}</div>
          <div class="description"><span class="pe-1">by</span><b class="score-break-word">{{ element.lastUpdated.who.loginId }}</b></div>
        </div>
      </td>
    </ng-container>
  </score-table-view>
  <ng-container ngProjectAs="[listActionBar]">
    <button mat-raised-button color="primary" (click)="next()"
      [hidden]="view().dataSource.data.length == 0"
      [disabled]="this.selection.selected.length == 0">
      Next
    </button>
  </ng-container>
</score-list-page>
