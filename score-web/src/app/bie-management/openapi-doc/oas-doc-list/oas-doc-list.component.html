<score-list-page title="OpenAPI Document">
  <ng-container ngProjectAs="[listActions]">
    <score-responsive-button label="New OpenAPI Document" link="create"/>
    <score-responsive-button label="Discard" icon="delete" color="warn" [disabled]="selection.selected.length === 0" (pressed)="discard()"/>
  </ng-container>

  <score-table-view emptyMessage="No OpenAPI Document" #tableView [table]="columns" [load]="load" multiSort [selection]="selection" [rowKey]="rowKey">

    <ng-container scoreColumnDef="title">
      <td score-cell *scoreCellDef="let element">
        <div class="businessTerm score-line-clamp-2 score-break-word">
          <a routerLink="{{ element.oasDocId }}">
            <span>{{ element.title }}</span>
          </a>
        </div>
        <div class="description">{{ element.guid }}</div>
      </td>
    </ng-container>

    <ng-container scoreColumnDef="openAPIVersion">
      <td score-cell *scoreCellDef="let element">
        <a target="_blank" rel="noopener noreferrer"
          href="{{ element.openAPIVersion }}">
          <span class="score-line-clamp-2 score-break-word">{{ displayOpenApiVersion(element.openAPIVersion) }}</span>
        </a>
      </td>
    </ng-container>

    <ng-container scoreColumnDef="version">
      <td score-cell *scoreCellDef="let element">
        <div class="score-line-clamp-2 score-break-word">{{ element.version }}</div>
      </td>
    </ng-container>

    <ng-container scoreColumnDef="licenseName">
      <td score-cell *scoreCellDef="let element">
        <div class="score-line-clamp-2 score-break-word">{{ element.licenseName }}</div>
      </td>
    </ng-container>

    <ng-container scoreColumnDef="description">
      <td score-cell *scoreCellDef="let element">
        <div class="description score-line-clamp-2 score-break-word"
        [innerHTML]="element.description | highlight : tableView.applied('description') : ['bg-warning']"></div>
      </td>
    </ng-container>

    <ng-container scoreColumnDef="lastUpdateTimestamp">
      <td score-cell *scoreCellDef="let element">
        <div class="score-line-clamp-2 score-break-word">
          <div>{{ element.lastUpdateTimestamp | date: 'yyyy-MM-dd HH:mm:ss' }}</div>
          <div class="description"><span class="pe-1">by</span><b class="score-break-word">{{ element.lastUpdatedBy.username }}</b></div>
        </div>
      </td>
    </ng-container>
    <!-- A narrow screen: the record as one block, not the columns squeezed. -->
    <ng-container *scoreCompactDef="let element">
      <score-record-compact-row [record]="compactRecord(element)"/>
    </ng-container>
  </score-table-view>
</score-list-page>
