<score-list-page>
  <ng-container ngProjectAs="[listTitle]">
    <score-title-with-library-selector [title]="title"
      [libraries]="libraryChoice.mappedLibraries"
      (libraryChange)="onLibraryChange($event)"/>
  </ng-container>
  <ng-container ngProjectAs="[listActions]">
    <button mat-raised-button class="ms-2" color="primary" (click)="create()">
      New BIE Package
    </button>
    <button mat-raised-button class="ms-2" color="warn" (click)="discard()"
      [disabled]="selection.selected.length === 0">
      Discard
    </button>
  </ng-container>

  <score-table-view #tableView [table]="columns" [load]="load" [extraParams]="extraParams()" [ready]="ready()"
    [selection]="selection" [rowKey]="rowKey"
    [busy]="busy()" multiSort advancedSearchOffset="14.5rem">

    <score-branch-selector searchPrefix multiple [releases]="releases" [selected]="selectedReleases"
      (selectedChange)="selectedReleases = $event; applyReleases()"/>

    <ng-container scoreColumnDef="state">
      <td score-cell *scoreCellDef="let element">
        <span class="bie-state {{ element.state }}"
            [ngStyle]="{'background-color': webPageInfo.getComponentStateColorSet(element.state).background,
            'color': webPageInfo.getComponentStateColorSet(element.state).font}">{{ element.state }}</span>
      </td>
    </ng-container>

    <ng-container scoreColumnDef="branch">
      <td score-cell *scoreCellDef="let element">
        <div class="d-flex">
          <span>{{ releaseNums(element) | join: ', ' }}</span>
        </div>
      </td>
    </ng-container>

    <ng-container scoreColumnDef="name">
      <td score-cell *scoreCellDef="let element">
        <a routerLink="{{ element.biePackageId }}">
          <div class="score-line-clamp-2 score-break-word">{{ element.name }}</div>
        </a>
      </td>
    </ng-container>

    <ng-container scoreColumnDef="versionId">
      <td score-cell *scoreCellDef="let element">
        <a routerLink="{{ element.biePackageId }}">
          <div class="score-line-clamp-2 score-break-word">{{ element.versionId }}</div>
        </a>
      </td>
    </ng-container>

    <ng-container scoreColumnDef="versionName">
      <td score-cell *scoreCellDef="let element">
        <a routerLink="{{ element.biePackageId }}">
          <div class="score-line-clamp-2 score-break-word">{{ element.versionName }}</div>
        </a>
      </td>
    </ng-container>

    <ng-container scoreColumnDef="owner">
      <td score-cell *scoreCellDef="let element">
        <div class="d-flex align-items-center align-content-center justify-content-between">
          <span class="score-line-clamp-2 score-break-word" [matTooltip]="element.owner.username" [innerHTML]="element.owner.loginId"></span>
          @if (isEditable(element) || isAdmin) {
            <mat-icon class="pointer align-self-center" style="padding-right: 24px;"
            (click)="openTransferDialog(element, $event)">swap_horiz</mat-icon>
          }
        </div>
      </td>
    </ng-container>

    <ng-container scoreColumnDef="description">
      <td score-cell *scoreCellDef="let element">
        <div class="description score-line-clamp-2 score-break-word"
        [innerHTML]="element.description | highlight : tableView.applied('description') : ['bg-warning']"></div>
      </td>
    </ng-container>

    <ng-container scoreColumnDef="lastUpdateTimestamp">
      <td score-cell *scoreCellDef="let element">
        <div class="score-line-clamp-2 score-break-word">
          <div>{{ element.lastUpdated.when | date: 'yyyy-MM-dd HH:mm:ss' }}</div>
          <div class="description"><span class="pe-1">by</span><b class="score-break-word">{{ element.lastUpdated.who.loginId }}</b></div>
        </div>
      </td>
    </ng-container>
  </score-table-view>
</score-list-page>
