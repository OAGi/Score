<score-dialog-page title="Deprecate BIE">
  <div class="dialog-form">
    <mat-form-field>
      <mat-label>Reason</mat-label>
      <textarea rows="6" cols="2000" matInput [(ngModel)]="data.reason"></textarea>
    </mat-form-field>
    <mat-form-field>
      <mat-label>Remark</mat-label>
      <textarea rows="6" cols="2000" matInput [(ngModel)]="data.remark"></textarea>
    </mat-form-field>
  </div>

  <ng-container ngProjectAs="[dialogActions]">
    <button mat-raised-button color="warn" (click)="onNoClick()">
      <mat-icon>close</mat-icon>
      <span class="ps-2">Close</span>
    </button>
    <button mat-raised-button color="primary"
            [mat-dialog-close]="data">
      <mat-icon>check</mat-icon>
      <span class="ps-2">Deprecate</span>
    </button>
  </ng-container>
</score-dialog-page>
