@if (isUpdating) {
  <div class="loading-container">
    <mat-spinner [diameter]="40"></mat-spinner>
  </div>
}

<score-dialog-page title="Edit '{{title}}' {{(element.directory) ? 'directory' : 'file'}}">
  <div class="content dialog-form">
    @if (!element.directory) {
      <div>
        <mat-form-field>
          <mat-label>Name</mat-label>
          <input [(ngModel)]="element.name" data-id="module.name" matInput maxlength="100" required/>
        </mat-form-field>
        <mat-form-field>
          <mat-label>Namespace</mat-label>
          <mat-select data-id="module.namespace" placeholder="Namespace"
            [(ngModel)]="element.namespaceId">
            <mat-option>
              <ngx-mat-select-search [formControl]="namespaceListFilterCtrl"
                [placeholderLabel]="'Search...'"
              [noEntriesFoundLabel]="'No matching namespace found.'"></ngx-mat-select-search>
            </mat-option>
            @for (namespace of filteredNamespaceList | async; track namespace) {
              <mat-option [value]="namespace.namespaceId">
                {{ namespace.uri }}
              </mat-option>
            }
          </mat-select>
        </mat-form-field>
        <mat-form-field>
          <mat-label>Version</mat-label>
          <input [(ngModel)]="element.versionNum" data-id="module.versionNum" matInput maxlength="100"/>
        </mat-form-field>
      </div>
    }
    @if (element.directory) {
      <div>
        <mat-form-field>
          <mat-label>Name</mat-label>
          <input [(ngModel)]="element.name" data-id="moduleDir.name" matInput maxlength="100" required/>
        </mat-form-field>
      </div>
    }
  </div>

  <ng-container ngProjectAs="[dialogActions]">
    <button (click)="cancel()" color="warn" mat-raised-button>
      <mat-icon>close</mat-icon>
      <span class="ps-2">Cancel</span>
    </button>
    <button (click)="onUpdateElement()" color="primary" mat-raised-button
        [disabled]="!canUpdate()">
      <mat-icon>check</mat-icon>
      <span class="ps-2">Update</span>
    </button>
    <button mat-raised-button class="ms-auto" color="accent" (click)="deleteModule()">
      <mat-icon>delete</mat-icon>
      <span class="ps-2">Discard</span>
    </button>
  </ng-container>
</score-dialog-page>
