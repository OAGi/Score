<score-list-page>
  <ng-container ngProjectAs="[listTitle]">
    <score-title-with-library-selector [title]="title"
      [libraries]="libraryChoice.mappedLibraries"
      (libraryChange)="onLibraryChange($event)"/>
  </ng-container>
  <ng-container ngProjectAs="[listActions]">
    @if (isDeveloper && libraryChoice.library?.libraryId) {
      <button
        (click)="create()" class="ms-2" color="primary" mat-raised-button>
        New Module Set Release
      </button>
    }
  </ng-container>

  <score-table-view #tableView [table]="columns" [load]="load" [extraParams]="extraParams()" [ready]="ready()"
    [busy]="busy()" [hiddenColumns]="isDeveloper ? [] : ['more']" sortStart="asc">

    <ng-container scoreColumnDef="name">
      <td *scoreCellDef="let element" score-cell>
        <div class="den score-line-clamp-2 score-break-word">
          <a routerLink="{{ element.moduleSetReleaseId }}">{{ element.name }}</a>
        </div>
      </td>
    </ng-container>

    <ng-container scoreColumnDef="release">
      <td *scoreCellDef="let element" score-cell>
        <div class="den score-line-clamp-2 score-break-word">
          <a routerLink="/release/{{ element.releaseId }}">{{ element.releaseNum }}</a>
        </div>
      </td>
    </ng-container>

    <ng-container scoreColumnDef="default">
      <td *scoreCellDef="let element" score-cell>
        @if (element.isDefault) {
          <div>Y</div>
        }
      </td>
    </ng-container>

    <ng-container scoreColumnDef="lastUpdateTimestamp">
      <td *scoreCellDef="let element" score-cell>
        <div class="score-line-clamp-2 score-break-word">
          <div>{{ element.lastUpdated.when | date: 'yyyy-MM-dd HH:mm:ss' }}</div>
          <div class="description"><span class="pe-1">by</span><b class="score-break-word">{{ element.lastUpdated.who.loginId }}</b></div>
        </div>
      </td>
    </ng-container>

    <ng-container [scoreColumnDef]="columns.column('more')">
      <td *scoreCellDef="let element" score-cell>
        <button mat-icon-button
          [matMenuTriggerFor]="contextMenu"
          (click)="contextMenuItem = element; $event.stopPropagation();">
          <mat-icon>more_vert</mat-icon>
        </button>
      </td>
    </ng-container>
  </score-table-view>

  <ng-container ngProjectAs="[listExtra]">
    <mat-menu class="context-menu" #contextMenu="matMenu">
      <button mat-menu-item (click)="discard(contextMenuItem)">
        <span class="context-menu-item">Discard</span>
      </button>
    </mat-menu>
  </ng-container>
</score-list-page>
