version: 2

# Version updates are grouped per ecosystem and directory (minor and patch together) so that
# each week brings few pull requests. Security updates are raised on their own by Dependabot.
updates:
  - package-ecosystem: npm
    directory: /score-web
    target-branch: develop
    schedule: {interval: weekly}
    groups:
      minor-and-patch: {update-types: [minor, patch]}

  - package-ecosystem: npm
    directory: /connect-center-api/docs
    target-branch: develop
    schedule: {interval: weekly}
    groups:
      minor-and-patch: {update-types: [minor, patch]}

  - package-ecosystem: npm
    directory: /score-external-api
    target-branch: develop
    schedule: {interval: weekly}
    groups:
      minor-and-patch: {update-types: [minor, patch]}

  - package-ecosystem: maven
    directory: /score-http
    target-branch: develop
    schedule: {interval: weekly}
    groups:
      minor-and-patch: {update-types: [minor, patch]}

  - package-ecosystem: maven
    directory: /score-e2e
    target-branch: develop
    schedule: {interval: weekly}
    groups:
      minor-and-patch: {update-types: [minor, patch]}

  - package-ecosystem: pip
    directory: /connect-center-api
    target-branch: develop
    schedule: {interval: weekly}
    groups:
      minor-and-patch: {update-types: [minor, patch]}

  - package-ecosystem: pip
    directory: /docs/user_guide
    target-branch: develop
    schedule: {interval: weekly}

  - package-ecosystem: docker
    directory: /score-http/docker
    target-branch: develop
    schedule: {interval: weekly}

  - package-ecosystem: docker
    directory: /score-web/docker
    target-branch: develop
    schedule: {interval: weekly}

  - package-ecosystem: docker
    directory: /score-repo/docker
    target-branch: develop
    schedule: {interval: weekly}

  - package-ecosystem: docker
    directory: /score-external-api/docker
    target-branch: develop
    schedule: {interval: weekly}

  - package-ecosystem: docker
    directory: /connect-center-api/docker
    target-branch: develop
    schedule: {interval: weekly}

  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule: {interval: weekly}
